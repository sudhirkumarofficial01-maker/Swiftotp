<script>
var configuration = {
  widgetId: "366871745777353932383132",
  tokenAuth: "561651TrwVu82eN76a8379b5P1",
  exposeMethods: true,

  success: function(data) {
    console.log("Success:", data);
  },

  failure: function(error) {
    console.log("Failure:", error);
    alert("OTP error: " + JSON.stringify(error));
  }
};

var otpReady = false;

var script = document.createElement("script");
script.src = "https://verify.msg91.com/otp-provider.js";
script.onload = function() {
  if (typeof window.initSendOTP === "function") {
    window.initSendOTP(configuration);
    otpReady = true;
    console.log("OTP Widget Ready");
  }
};
script.onerror = function() {
  alert("OTP service load nahi hui.");
};
document.head.appendChild(script);

document.getElementById("sendOtp").addEventListener("click", function() {
  var number = document.getElementById("mobile").value.trim();

  if (!/^[6-9]\d{9}$/.test(number)) {
    alert("10 digit valid Indian mobile number डालें.");
    return;
  }

  if (!otpReady || typeof window.sendOtp !== "function") {
    alert("OTP service abhi ready nahi hai. Page refresh karke dobara try karein.");
    return;
  }

  // MSG91 identifier country code ke bina leta hai
  var identifier = "91" + number;

  window.sendOtp(
    identifier,
    function(data) {
      alert("OTP भेज दिया गया है.");
      console.log("OTP sent:", data);
    },
    function(error) {
      alert("OTP भेजने में समस्या: " + JSON.stringify(error));
      console.log("OTP error:", error);
    }
  );
});
</script>
